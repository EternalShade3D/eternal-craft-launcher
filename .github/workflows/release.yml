name: Release

# The fork ships one artifact: the Windows portable zip. No signing, no other platforms,
# no secrets needed. Run it from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.4.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  portable:
    name: Windows portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@v2
        with:
          key: fork-release
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "${{ inputs.version }}"
      - name: Build, zip, checksum
        shell: pwsh
        run: ./packaging/windows/package-fork.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: fork-release
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Draft GitHub Release
    needs: portable
    if: "!cancelled() && !contains(needs.*.result, 'failure')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fork-release
          path: artifacts
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 -A2 '\[workspace.package\]' Cargo.toml | grep -oP 'version = "\K[^"]+')
          fi
          tag="v$VERSION"
          title="Eternal Craft Launcher v$VERSION"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $tag is already published. Bump the version before running again."
              exit 1
            fi
            echo "Updating draft $tag: replacing its assets"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA"
            gh release upload "$tag" --clobber -- artifacts/*
          else
            echo "Creating draft $tag"
            gh release create "$tag" --draft --title "$title" --notes-file packaging/windows/fork-release-notes.md artifacts/*
          fi
